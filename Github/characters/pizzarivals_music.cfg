# PizzaRivals custom music. One entry per line:
#
#   LEVEL  "Name"      (song)    the music of a level (John Gutter, Entrance, Pizzascape, Medieval, ...)
#   ESCAPE "Character" (song)    the Pizza Time music while playing that character
#   LAP2   "Character" (song)    the lap 2 music while playing that character
#
# song is either a Rivals of Aether song (music_holy, music_plasma, music_abyss, ... it plays its intro and then loops)
# or the full path of an .ogg file (it just loops):
#   ESCAPE "Wren" (G:\games\steamapps\workshop\content\383980\2479111221\sounds\music_loop.ogg)
#
# Anything missing (or an entry with a song that does not exist) plays Pizza Tower's own music.
# The Rivals songs are read from the game's audio groups into the pizzarivals_music folder (tools/roa_sounds.py).
#
# LEVEL "Entrance" (music_holy)
# ESCAPE "Clairen" (music_plasma)
# LAP2 "Clairen" (music_abyss)
